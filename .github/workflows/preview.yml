name: Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ vars.R2_BUCKET_URL }}
      R2_STATE_BUCKET_NAME: ${{ vars.R2_STATE_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Initialise preview infrastructure
        working-directory: infra/environments/preview
        run: tofu init -backend-config="bucket=${R2_STATE_BUCKET_NAME}"

      - name: Plan preview infrastructure
        id: infrastructure
        working-directory: infra/environments/preview
        run: |
          set +e
          tofu plan -detailed-exitcode -out=preview.tfplan
          exit_code=$?
          set -e

          case "${exit_code}" in
            0) echo "apply=false" >> "${GITHUB_OUTPUT}" ;;
            2) echo "apply=true" >> "${GITHUB_OUTPUT}" ;;
            *) exit "${exit_code}" ;;
          esac

      - name: Apply preview infrastructure
        if: steps.infrastructure.outputs.apply == 'true'
        working-directory: infra/environments/preview
        run: tofu apply -auto-approve preview.tfplan

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build

      - name: Deploy application preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=craigforrest-co-uk-preview --branch=preview --commit-hash=${{ steps.revision.outputs.sha }}
