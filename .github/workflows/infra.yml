name: Infra

on:
  pull_request:
    paths: [infra/**]
  push:
    branches: [main]
    paths: [infra/**]

defaults:
  run:
    working-directory: infra/environments/production

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: ${{ vars.R2_BUCKET_URL }}
  R2_STATE_BUCKET_NAME: ${{ vars.R2_STATE_BUCKET_NAME }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-production-infrastructure
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu init -backend-config="bucket=${R2_STATE_BUCKET_NAME}"
      - run: tofu plan

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-production-infrastructure
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu init -backend-config="bucket=${R2_STATE_BUCKET_NAME}"
      - run: tofu plan -out=production.tfplan
      - run: tofu apply -auto-approve production.tfplan
